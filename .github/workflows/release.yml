name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-linux
            name: linux-x64
          - os: ubuntu-22.04-arm
            target: aarch64-linux
            name: linux-arm64
          - os: macos-14
            target: aarch64-macos
            name: macos-arm64
          - os: windows-latest
            target: x86_64-windows
            name: windows-x64
          # Cross-compiled targets
          - os: ubuntu-22.04
            target: x86_64-macos
            name: macos-x64
          - os: ubuntu-22.04
            target: x86_64-linux-musl
            name: linux-musl-x64
          - os: ubuntu-22.04
            target: aarch64-linux-musl
            name: linux-musl-arm64
          - os: ubuntu-22.04
            target: riscv64-linux
            name: linux-riscv64
          - os: ubuntu-22.04
            target: aarch64-windows
            name: windows-arm64
          - os: ubuntu-22.04
            target: wasm32-wasi
            name: wasi

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: true

      - name: Install Zig via ghr
        uses: cataggar/ghr/actions/install@v0.7.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tools: |
            cataggar/zig@v0.16.0 RWSGOq2NVecA2UPNdBUZykf1CCb147pkmdtYxgb3Ti+JO/wCYvhbAb/U

      - name: Get version
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build
        run: zig build -Doptimize=ReleaseSafe -Dtarget=${{ matrix.target }} -Dstrip=true -Dstack-protector=true "-Dversion=${{ steps.version.outputs.version }}"

      - name: Smoke installed OCI command help
        if: >-
          matrix.name == 'linux-x64'
          || matrix.name == 'linux-arm64'
          || matrix.name == 'macos-arm64'
          || matrix.name == 'windows-x64'
        shell: bash
        run: |
          case "${{ matrix.target }}" in
            *-windows) WABT="./zig-out/bin/wabt.exe" ;;
            *)         WABT="./zig-out/bin/wabt" ;;
          esac
          "$WABT" help oci
          "$WABT" oci help
          for verb in push pull copy inspect resolve list-tags; do
            "$WABT" help oci "$verb"
            "$WABT" oci help "$verb"
            "$WABT" oci "$verb" help
          done

      - name: Package
        shell: bash
        run: |
          PKGNAME="wabt-${{ steps.version.outputs.version }}-${{ matrix.name }}"
          mkdir -p "$PKGNAME/bin"
          case "${{ matrix.target }}" in
            wasm32-wasi) EXT=".wasm" ;;
            *-windows)   EXT=".exe" ;;
            *)           EXT="" ;;
          esac
          cp "zig-out/bin/wabt${EXT}" "$PKGNAME/bin/"
          mkdir -p "$PKGNAME/LICENSES"
          cp LICENSE README.md SOURCE_PROVENANCE.md THIRD_PARTY_NOTICES.md "$PKGNAME/"
          cp LICENSES/miz-MIT.txt "$PKGNAME/LICENSES/"
          cp -R docs "$PKGNAME/"
          tar czf "$PKGNAME.tar.gz" "$PKGNAME"
          test "$(tar tzf "$PKGNAME.tar.gz" | grep -Ec '/bin/[^/]+$')" -eq 1
          tar tzf "$PKGNAME.tar.gz" | grep -Fx "$PKGNAME/LICENSE"
          tar tzf "$PKGNAME.tar.gz" | grep -Fx "$PKGNAME/README.md"
          tar tzf "$PKGNAME.tar.gz" | grep -Fx "$PKGNAME/SOURCE_PROVENANCE.md"
          tar tzf "$PKGNAME.tar.gz" | grep -Fx "$PKGNAME/THIRD_PARTY_NOTICES.md"
          tar tzf "$PKGNAME.tar.gz" | grep -Fx "$PKGNAME/LICENSES/miz-MIT.txt"
          tar tzf "$PKGNAME.tar.gz" | grep -Fx "$PKGNAME/docs/oci.md"
          tar tzf "$PKGNAME.tar.gz" | grep -Fx "$PKGNAME/docs/oci-authentication.md"

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: zig-out/bin/
          output-file: wabt-${{ steps.version.outputs.version }}-${{ matrix.name }}.sbom.spdx.json
          upload-artifact: false

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.name }}
          path: |
            wabt-*.tar.gz
            wabt-*.sbom.spdx.json

  source:
    name: Source tarball
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: true

      - name: Get version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Package source
        run: |
          PKGNAME="wabt-${{ steps.version.outputs.version }}"
          git archive --format=tar --prefix="$PKGNAME/" HEAD | xz > "$PKGNAME.tar.xz"
          tar tJf "$PKGNAME.tar.xz" | grep -Fx "$PKGNAME/LICENSE"
          tar tJf "$PKGNAME.tar.xz" | grep -Fx "$PKGNAME/README.md"
          tar tJf "$PKGNAME.tar.xz" | grep -Fx "$PKGNAME/SOURCE_PROVENANCE.md"
          tar tJf "$PKGNAME.tar.xz" | grep -Fx "$PKGNAME/THIRD_PARTY_NOTICES.md"
          tar tJf "$PKGNAME.tar.xz" | grep -Fx "$PKGNAME/LICENSES/miz-MIT.txt"
          tar tJf "$PKGNAME.tar.xz" | grep -Fx "$PKGNAME/docs/oci.md"
          tar tJf "$PKGNAME.tar.xz" | grep -Fx "$PKGNAME/docs/oci-authentication.md"
          tar tJf "$PKGNAME.tar.xz" | grep -Fx "$PKGNAME/src/tools/wabt.zig"
          tar tJf "$PKGNAME.tar.xz" | grep -Fx "$PKGNAME/src/tools/oci.zig"

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: source
          path: |
            wabt-*.tar.xz

  release:
    name: Create Release
    needs: [build, source]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          merge-multiple: true

      - name: Get version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Install ghr
        run: pipx install ghr-bin==0.7.0

      - name: Sign archives with minisign (per-asset .minisig sidecars)
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD:   ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          for asset in wabt-*.tar.gz wabt-*.tar.xz; do
            # Trusted comment is printed by `ghr install` on successful
            # verification, so encode self-identifying metadata in it.
            comment="timestamp:$(date +%s) file:${asset} commit:${GITHUB_SHA} tag:${GITHUB_REF_NAME}"
            echo "signing ${asset} (trusted comment: ${comment})"
            ghr minisign sign "$asset" -t "$comment"
          done
          ls -la wabt-*.minisig

      - name: Attest build provenance
        uses: actions/attest-build-provenance@c074443f1aee8d4aeeae555aebba3282517141b2 # v2.2.3
        with:
          subject-path: |
            wabt-*.tar.gz
            wabt-*.tar.xz

      - name: Create release
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 # v2.2.2
        with:
          name: wabt ${{ steps.version.outputs.version }}
          body: |
            ## Highlights

            - Native single-binary OCI transport supports push, resolve, inspect, pull, copy, and tag listing for validated WebAssembly artifacts and OCI layouts.
            - Interoperability is qualified separately against pinned ORAS and wkg/oci-wasm producers; those tools and a WebAssembly runtime are not mandatory dependencies.
            - OCI transport does not execute code and is not a production-readiness, signature-verification, attestation-verification, or cross-runtime compatibility claim.

            ## Full changelog

            See the commit history and generated release assets for `${{ github.ref_name }}`.

            ## Install

            ```
            ghr install cataggar/wabt@v${{ steps.version.outputs.version }} RWSBnHWjwk/kkqdYc74cGupHMNVobpmF3lPc7b8RIllYMmYBr5G2EyF0
            ```
          files: |
            wabt-*.tar.gz
            wabt-*.tar.xz
            wabt-*.sbom.spdx.json
            wabt-*.minisig
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, 'dev') }}
