name: Publish to PyPI

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 2.0.0)"
        required: true

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'workflow_dispatch' && !contains(inputs.version, 'dev'))
      || (github.event.workflow_run.conclusion == 'success'
          && !contains(github.event.workflow_run.head_branch, 'dev'))
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Extract version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            V="${{ inputs.version }}"
          else
            V="${{ github.event.workflow_run.head_branch }}"
          fi
          echo "version=${V#v}" >> "$GITHUB_OUTPUT"
      - name: Build wheels
        run: uv run scripts/build_wheels.py ${{ steps.version.outputs.version }}
      - name: Verify wheel contents
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          required = {
              "README.md",
              "licenses/LICENSE",
              "licenses/SOURCE_PROVENANCE.md",
              "licenses/THIRD_PARTY_NOTICES.md",
              "licenses/LICENSES/miz-MIT.txt",
          }
          wheels = sorted(Path("dist").glob("*.whl"))
          assert wheels
          for wheel in wheels:
              with ZipFile(wheel) as archive:
                  names = archive.namelist()
              scripts = [
                  name for name in names
                  if ".data/scripts/" in name and not name.endswith("/")
              ]
              assert len(scripts) == 1, (wheel, scripts)
              assert Path(scripts[0]).name in {"wabt", "wabt.exe"}, scripts[0]
              for suffix in required:
                  assert any(name.endswith(f".dist-info/{suffix}") for name in names), (
                      wheel,
                      suffix,
                  )
          PY
      - name: Smoke host wheel OCI command help
        run: |
          uv venv .wheel-smoke
          uv pip install --python .wheel-smoke/bin/python dist/*manylinux_2_17_x86_64*.whl
          PATH="$PWD/.wheel-smoke/bin:$PATH" wabt help oci
          PATH="$PWD/.wheel-smoke/bin:$PATH" wabt oci help
          for verb in push pull copy inspect resolve list-tags; do
            PATH="$PWD/.wheel-smoke/bin:$PATH" wabt help oci "$verb"
            PATH="$PWD/.wheel-smoke/bin:$PATH" wabt oci help "$verb"
            PATH="$PWD/.wheel-smoke/bin:$PATH" wabt oci "$verb" help
          done
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
