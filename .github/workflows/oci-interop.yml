name: OCI external-tool interoperability

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/oci-interop.yml"
      - "build.zig"
      - "src/oci/**"
      - "src/tools/oci*.zig"
      - "src/component/fixtures/stdio-echo.wasm"
      - "src/fixtures/oci/**"
      - "scripts/oci_interop.py"
      - "scripts/check_oci_qualification.py"
      - "scripts/oci/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/oci-interop.yml"
      - "build.zig"
      - "src/oci/**"
      - "src/tools/oci*.zig"
      - "src/component/fixtures/stdio-echo.wasm"
      - "src/fixtures/oci/**"
      - "scripts/oci_interop.py"
      - "scripts/check_oci_qualification.py"
      - "scripts/oci/**"

permissions:
  contents: read

concurrency:
  group: oci-interop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pinned-qualification:
    name: Pinned ORAS/wkg interoperability matrix
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      ORAS_VERSION: 1.3.4
      ORAS_COMMIT: db9e29505c3059f2b8fde34ae8cae266c5c765e9
      ORAS_ARCHIVE: oras_1.3.4_linux_amd64.tar.gz
      ORAS_ARCHIVE_SHA256: f27adb935022d94df8dc77719c322dda592c78a0d57a6f7dcdd8d900b248c454
      ORAS_CHECKSUMS_SHA256: 19d479e497fb5e30c7de3c621e3ed337e3857de0d96542021a73e2d8016dbe5a
      WKG_VERSION: 0.16.1
      WKG_REVISION: 5a4c2ab721e12511f39bb9cb42cf71fe76f6c89a
      WKG_CARGO_LOCK_SHA256: bf465c989fa26cb06778624fd2de843ca5d6318b4a58418c9e392e13dc02d732
      OCI_WASM_VERSION: 0.6.0
      OCI_WASM_TAG_COMMIT: 8d1cecafef729cbd7240d9701d2dea5eaa6f4fdd
      OCI_WASM_CHECKSUM: 87689298bd74f0f2675fcac99956a34c31098ca3bdced3d7635e71dc03c5ca21
      REGISTRY_IMAGE: registry:3.0.0@sha256:6c5666b861f3505b116bb9aa9b25175e71210414bd010d92035ff64018f9457e
      REGISTRY_AUTHORITY: 127.0.0.1:5000
      SOURCE_DATE_EPOCH: "1735689600"
      CARGO_TERM_COLOR: never
      CARGO_HOME: ${{ github.workspace }}/.cache/cargo-home
      WKG_TARGET_DIR: ${{ github.workspace }}/.cache/wkg-target
      TOOLS_DIR: ${{ github.workspace }}/zig-out/oci-tools
      QUALIFICATION_DIR: ${{ github.workspace }}/zig-out/oci-qualification

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: true

      - name: Install Zig
        uses: cataggar/ghr/actions/install@742def10309cb0069252c0d0427ded0150f957c9 # v0.7.0
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          tools: |
            cataggar/zig@v0.16.0 RWSGOq2NVecA2UPNdBUZykf1CCb147pkmdtYxgb3Ti+JO/wCYvhbAb/U

      - name: Verify qualification contract
        run: |
          set -euo pipefail
          python3 scripts/check_oci_qualification.py
          test -s src/fixtures/oci/manifest.json
          test -s scripts/oci/generate_interop_fixtures.sh
          test -s scripts/oci/verify_interop_fixtures.sh

      - name: Record Rust toolchain cache key
        id: rust
        run: |
          set -euo pipefail
          mkdir -p "$QUALIFICATION_DIR" "$CARGO_HOME" "$WKG_TARGET_DIR"
          rustc -Vv
          cargo -V
          {
            rustc -Vv
            cargo -V
          } > "$QUALIFICATION_DIR/rust-versions.txt"
          key="$(sha256sum "$QUALIFICATION_DIR/rust-versions.txt" | cut -d' ' -f1)"
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - name: Restore verified wkg build artifacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.WKG_TARGET_DIR }}
          key: oci-interop-wkg-${{ runner.os }}-${{ env.WKG_REVISION }}-${{ env.WKG_CARGO_LOCK_SHA256 }}-${{ steps.rust.outputs.key }}

      - name: Fetch and verify ORAS
        run: |
          set -euo pipefail
          mkdir -p "$TOOLS_DIR" "$QUALIFICATION_DIR/downloads"
          python3 - <<'PY'
          import os
          from pathlib import Path
          from urllib.request import urlopen

          base = "https://github.com/oras-project/oras/releases/download/v" + os.environ["ORAS_VERSION"]
          output = Path(os.environ["QUALIFICATION_DIR"]) / "downloads"
          for name in (
              f"oras_{os.environ['ORAS_VERSION']}_checksums.txt",
              os.environ["ORAS_ARCHIVE"],
          ):
              with urlopen(f"{base}/{name}", timeout=120) as response:
                  (output / name).write_bytes(response.read())
          PY
          checksums="$QUALIFICATION_DIR/downloads/oras_${ORAS_VERSION}_checksums.txt"
          archive="$QUALIFICATION_DIR/downloads/$ORAS_ARCHIVE"
          echo "$ORAS_CHECKSUMS_SHA256  $checksums" | sha256sum -c -
          echo "$ORAS_ARCHIVE_SHA256  $archive" | sha256sum -c -
          grep -F "$ORAS_ARCHIVE_SHA256  $ORAS_ARCHIVE" "$checksums"
          tar -xzf "$archive" -C "$TOOLS_DIR" oras
          test "$(sha256sum "$archive" | cut -d' ' -f1)" = "$ORAS_ARCHIVE_SHA256"
          "$TOOLS_DIR/oras" version | tee "$QUALIFICATION_DIR/oras-version.txt"
          grep -Eq '(^|[^0-9])1\.3\.4([^0-9]|$)' "$QUALIFICATION_DIR/oras-version.txt"
          grep -F "$ORAS_COMMIT" "$QUALIFICATION_DIR/oras-version.txt"

      - name: Fetch, verify, and build wkg
        run: |
          set -euo pipefail
          source_dir="$QUALIFICATION_DIR/wasm-pkg-tools"
          rm -rf "$source_dir"
          git init --quiet "$source_dir"
          git -C "$source_dir" remote add origin https://github.com/bytecodealliance/wasm-pkg-tools.git
          git -C "$source_dir" fetch --quiet --depth=1 origin "$WKG_REVISION"
          git -C "$source_dir" -c advice.detachedHead=false checkout --quiet --detach FETCH_HEAD
          test "$(git -C "$source_dir" rev-parse HEAD)" = "$WKG_REVISION"
          test "$(sha256sum "$source_dir/Cargo.lock" | cut -d' ' -f1)" = "$WKG_CARGO_LOCK_SHA256"
          SOURCE_DIR="$source_dir" python3 - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          lock = tomllib.loads((Path(os.environ["SOURCE_DIR"]) / "Cargo.lock").read_text())
          packages = [
              package for package in lock["package"]
              if package["name"] == "oci-wasm"
          ]
          assert len(packages) == 1
          assert packages[0]["version"] == os.environ["OCI_WASM_VERSION"]
          assert packages[0]["checksum"] == os.environ["OCI_WASM_CHECKSUM"]
          PY
          cargo build --quiet --locked --release -p wkg \
            --manifest-path "$source_dir/Cargo.toml" \
            --target-dir "$WKG_TARGET_DIR"
          install -m 0755 "$WKG_TARGET_DIR/release/wkg" "$TOOLS_DIR/wkg"
          "$TOOLS_DIR/wkg" --version | tee "$QUALIFICATION_DIR/wkg-version.txt"
          grep -Fx "wkg $WKG_VERSION" "$QUALIFICATION_DIR/wkg-version.txt"
          sha256sum "$TOOLS_DIR/wkg" | tee "$QUALIFICATION_DIR/wkg.sha256"

      - name: Record verified producer versions
        run: |
          set -euo pipefail
          export PATH="$TOOLS_DIR:$PATH"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          tools = Path(os.environ["TOOLS_DIR"])
          def digest(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()
          record = {
              "schema": "wabt.oci.qualification-tools",
              "schemaVersion": 1,
              "oras": {
                  "version": subprocess.check_output([tools / "oras", "version"], text=True).strip(),
                  "commit": os.environ["ORAS_COMMIT"],
                  "archiveSha256": os.environ["ORAS_ARCHIVE_SHA256"],
                  "checksumsSha256": os.environ["ORAS_CHECKSUMS_SHA256"],
                  "binarySha256": digest(tools / "oras"),
              },
              "wkg": {
                  "version": subprocess.check_output([tools / "wkg", "--version"], text=True).strip(),
                  "revision": os.environ["WKG_REVISION"],
                  "cargoLockSha256": os.environ["WKG_CARGO_LOCK_SHA256"],
                  "binarySha256": digest(tools / "wkg"),
              },
              "ociWasm": {
                  "version": os.environ["OCI_WASM_VERSION"],
                  "tagCommit": os.environ["OCI_WASM_TAG_COMMIT"],
                  "crateChecksum": os.environ["OCI_WASM_CHECKSUM"],
              },
              "rustc": subprocess.check_output(["rustc", "-Vv"], text=True).strip(),
              "cargo": subprocess.check_output(["cargo", "-V"], text=True).strip(),
              "registryImage": os.environ["REGISTRY_IMAGE"],
          }
          output = Path(os.environ["QUALIFICATION_DIR"])
          output.mkdir(parents=True, exist_ok=True)
          (output / "tool-versions.json").write_text(
              json.dumps(record, indent=2, sort_keys=True) + "\n"
          )
          PY

      - name: Build WABT ReleaseSafe
        run: zig build -Doptimize=ReleaseSafe

      - name: Regenerate fixtures twice and reject drift
        run: |
          set -euo pipefail
          export PATH="$TOOLS_DIR:$PATH"
          current_registry=""
          stop_registry() {
            if [ -n "$current_registry" ]; then
              docker stop --time 5 "$current_registry" >/dev/null 2>&1 || true
              current_registry=""
            fi
          }
          start_registry() {
            local name="$1"
            stop_registry
            docker run --detach --rm \
              --name "$name" \
              --publish 127.0.0.1:5000:5000 \
              --tmpfs /var/lib/registry:rw,size=1073741824,mode=0700 \
              --memory 512m --cpus 2 --pids-limit 256 --read-only \
              "$REGISTRY_IMAGE" >/dev/null
            current_registry="$name"
            for attempt in $(seq 1 30); do
              if python3 - 2>/dev/null <<'PY'
          from urllib.request import urlopen
          with urlopen("http://127.0.0.1:5000/v2/", timeout=2) as response:
              assert response.status == 200
          PY
              then
                return
              fi
              sleep 1
            done
            echo "registry failed to become ready" >&2
            return 1
          }
          trap stop_registry EXIT
          docker pull "$REGISTRY_IMAGE" >/dev/null
          docker image inspect "$REGISTRY_IMAGE" \
            --format '{{.Id}} {{join .RepoDigests " "}}' \
            > "$QUALIFICATION_DIR/registry-image.txt"
          docker run --rm "$REGISTRY_IMAGE" --version \
            >> "$QUALIFICATION_DIR/registry-image.txt"
          cat "$QUALIFICATION_DIR/registry-image.txt"

          refresh() {
            local suffix="$1"
            local tree="$QUALIFICATION_DIR/refresh-$suffix"
            rm -rf "$tree"
            mkdir -p "$tree"
            git archive HEAD | tar -x -C "$tree"
            start_registry "wabt-oci-fixtures-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$suffix"
            (
              cd "$tree"
              export WABT="$GITHUB_WORKSPACE/zig-out/bin/wabt"
              export ORAS="$TOOLS_DIR/oras"
              export WKG="$TOOLS_DIR/wkg"
              export OCI_REGISTRY="$REGISTRY_AUTHORITY"
              export OCI_INTEROP_REGISTRY="$REGISTRY_AUTHORITY"
              export REGISTRY="$REGISTRY_AUTHORITY"
              export OCI_PLAIN_HTTP=1
              export OCI_INTEROP_WORK_DIR="$tree/zig-out/fixture-refresh"
              export OCI_INTEROP_NAMESPACE="fixture-repro"
              export TZ=UTC LC_ALL=C
              mkdir -p "$tree/zig-out"
              ulimit -f 131072
              if ! timeout 15m bash scripts/oci/generate_interop_fixtures.sh \
                > "$tree/zig-out/generate.log" 2>&1; then
                tail -n 200 "$tree/zig-out/generate.log" >&2
                exit 1
              fi
              if ! timeout 5m bash scripts/oci/verify_interop_fixtures.sh \
                > "$tree/zig-out/verify.log" 2>&1; then
                tail -n 200 "$tree/zig-out/verify.log" >&2
                exit 1
              fi
              rm -f "$tree/zig-out/generate.log" "$tree/zig-out/verify.log"
            )
            stop_registry
            diff -ru "$GITHUB_WORKSPACE/src/fixtures/oci" "$tree/src/fixtures/oci"
          }

          refresh one
          refresh two
          diff -ru \
            "$QUALIFICATION_DIR/refresh-one/src/fixtures/oci" \
            "$QUALIFICATION_DIR/refresh-two/src/fixtures/oci"

      - name: Run full live ORAS/wkg matrix
        run: |
          set -euo pipefail
          export PATH="$TOOLS_DIR:$PATH"
          container="wabt-oci-interop-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            docker stop --time 5 "$container" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker run --detach --rm \
            --name "$container" \
            --publish 127.0.0.1:5000:5000 \
            --tmpfs /var/lib/registry:rw,size=1073741824,mode=0700 \
            --memory 512m --cpus 2 --pids-limit 256 --read-only \
            "$REGISTRY_IMAGE" >/dev/null
          for attempt in $(seq 1 30); do
            if python3 - 2>/dev/null <<'PY'
          from urllib.request import urlopen
          with urlopen("http://127.0.0.1:5000/v2/", timeout=2) as response:
              assert response.status == 200
          PY
            then
              break
            fi
            test "$attempt" -lt 30
            sleep 1
          done
          export ORAS="$TOOLS_DIR/oras"
          export WKG="$TOOLS_DIR/wkg"
          export OCI_REGISTRY="$REGISTRY_AUTHORITY"
          export OCI_INTEROP_RUN_ID="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          export OCI_INTEROP_WORK_DIR="$QUALIFICATION_DIR/live"
          export OCI_INTEROP_RESULTS="$QUALIFICATION_DIR/results.json"
          zig build oci-interop -Doptimize=ReleaseSafe
          test "$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["status"])' "$QUALIFICATION_DIR/results.json")" = passed
          used_kib="$(du -sk "$GITHUB_WORKSPACE/.cache" "$GITHUB_WORKSPACE/zig-out" | awk '{sum += $1} END {print sum}')"
          test "$used_kib" -le 10485760

      - name: Upload concise failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: oci-interop-failure-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            zig-out/oci-qualification/results.json
            zig-out/oci-qualification/tool-versions.json
            zig-out/oci-qualification/registry-image.txt
