name: OCI external-tool interoperability

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/oci-interop.yml"
      - "build.zig"
      - "docs/oci*.md"
      - "README.md"
      - "SOURCE_PROVENANCE.md"
      - "THIRD_PARTY_NOTICES.md"
      - "src/oci/**"
      - "src/tools/oci*.zig"
      - "src/component/fixtures/stdio-echo.wasm"
      - "src/fixtures/oci/**"
      - "src/oci/qualification_test.zig"
      - "tools/oci_fixture_manifest.zig"
      - "scripts/oci/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/oci-interop.yml"
      - "build.zig"
      - "docs/oci*.md"
      - "README.md"
      - "SOURCE_PROVENANCE.md"
      - "THIRD_PARTY_NOTICES.md"
      - "src/oci/**"
      - "src/tools/oci*.zig"
      - "src/component/fixtures/stdio-echo.wasm"
      - "src/fixtures/oci/**"
      - "src/oci/qualification_test.zig"
      - "tools/oci_fixture_manifest.zig"
      - "scripts/oci/**"

permissions:
  contents: read
  attestations: read

concurrency:
  group: oci-interop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pinned-qualification:
    name: Pinned Linux/arm64 ORAS/wkg qualification
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 120
    env:
      WABT_OCI_INTEROP_MODE: qualify
      WABT_OCI_INTEROP_MAX_STATE_KIB: "12582912"

    steps:
      - name: Configure bounded runner state
        run: echo "WABT_OCI_INTEROP_STATE_DIR=$RUNNER_TEMP/wabt-oci-interoperability" >> "$GITHUB_ENV"

      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: true
          persist-credentials: false

      - name: Install pinned Zig
        uses: cataggar/ghr/actions/install@a3be8c61b9d5c2bd6d38e6d067c69d70434a6db9 # v0.9.1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          ghr-version: v0.9.1
          tools: |
            cataggar/zig@v0.17.0 RWSGOq2NVecA2UPNdBUZykf1CCb147pkmdtYxgb3Ti+JO/wCYvhbAb/U

      - name: Verify offline fixture and qualification contracts
        run: |
          set -euo pipefail
          bash scripts/oci/verify_interop_fixtures.sh
          zig build test-oci-qualification

      - name: Restore bounded producer caches
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ${{ runner.temp }}/wabt-oci-interoperability/tools/downloads
            ${{ runner.temp }}/wabt-oci-interoperability/tools/rustup
            ${{ runner.temp }}/wabt-oci-interoperability/tools/cargo
            ${{ runner.temp }}/wabt-oci-interoperability/tools/cargo-target
            ${{ runner.temp }}/wabt-oci-interoperability/cache/zig-global
          key: oci-interop-arm64-v1-rust-1.97.0-wkg-5a4c2ab721e12511f39bb9cb42cf71fe76f6c89a-${{ hashFiles('scripts/oci/generate_interop_fixtures.sh', 'tools/oci_fixture_manifest.zig') }}
          restore-keys: oci-interop-arm64-v1-rust-1.97.0-wkg-5a4c2ab721e12511f39bb9cb42cf71fe76f6c89a-

      - name: Run two clean pinned qualifications
        run: |
          set -euo pipefail
          logs="$WABT_OCI_INTEROP_STATE_DIR/ci-logs"
          mkdir -p "$logs"
          for pass in one two; do
            log="$logs/$pass.log"
            if ! timeout --foreground 55m \
              bash scripts/oci/generate_interop_fixtures.sh >"$log" 2>&1; then
              echo "external interoperability pass $pass failed" >&2
              exit 1
            fi
            grep -Fx "mode=qualify" \
              "$WABT_OCI_INTEROP_STATE_DIR/results/status.txt"
            grep -Fx "verified=2026-09-19T00:00:00Z" \
              "$WABT_OCI_INTEROP_STATE_DIR/results/status.txt"
            bash scripts/oci/verify_interop_fixtures.sh
          done
          git diff --exit-code -- src/fixtures/oci
          test ! -e "$WABT_OCI_INTEROP_STATE_DIR/work"
          used_kib="$(du -sk "$WABT_OCI_INTEROP_STATE_DIR" | awk '{print $1}')"
          test "$used_kib" -le "$WABT_OCI_INTEROP_MAX_STATE_KIB"
          rm -rf "$logs"

      - name: Prepare concise redacted failure diagnostics
        if: failure()
        run: |
          set -euo pipefail
          zig run tools/oci_fixture_manifest.zig -- failure-summary \
            --state "$WABT_OCI_INTEROP_STATE_DIR" \
            --manifest src/fixtures/oci/manifest.json \
            --output zig-out/oci-interop-failure/summary.txt
          test "$(wc -c < zig-out/oci-interop-failure/summary.txt)" -le 65536

      - name: Upload concise failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: oci-interop-failure-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 3
          path: zig-out/oci-interop-failure/summary.txt
