name: OCI external-tool interoperability

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/oci-interop.yml"
      - "build.zig"
      - "docs/oci*.md"
      - "README.md"
      - "SOURCE_PROVENANCE.md"
      - "THIRD_PARTY_NOTICES.md"
      - "src/oci/**"
      - "src/tools/oci*.zig"
      - "src/component/fixtures/stdio-echo.wasm"
      - "src/fixtures/oci/**"
      - "scripts/check_oci_qualification.py"
      - "scripts/oci/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/oci-interop.yml"
      - "build.zig"
      - "docs/oci*.md"
      - "README.md"
      - "SOURCE_PROVENANCE.md"
      - "THIRD_PARTY_NOTICES.md"
      - "src/oci/**"
      - "src/tools/oci*.zig"
      - "src/component/fixtures/stdio-echo.wasm"
      - "src/fixtures/oci/**"
      - "scripts/check_oci_qualification.py"
      - "scripts/oci/**"

permissions:
  contents: read

concurrency:
  group: oci-interop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pinned-qualification:
    name: Pinned Linux/arm64 ORAS/wkg qualification
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 120
    env:
      WABT_OCI_INTEROP_MODE: qualify
      WABT_OCI_INTEROP_STATE_DIR: ${{ runner.temp }}/wabt-oci-interoperability
      WABT_OCI_INTEROP_MAX_STATE_KIB: "12582912"

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: true
          persist-credentials: false

      - name: Install pinned Zig
        uses: cataggar/ghr/actions/install@742def10309cb0069252c0d0427ded0150f957c9 # v0.7.0
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          tools: |
            cataggar/zig@v0.16.0 RWSGOq2NVecA2UPNdBUZykf1CCb147pkmdtYxgb3Ti+JO/wCYvhbAb/U

      - name: Verify offline fixture and qualification contracts
        run: |
          set -euo pipefail
          bash scripts/oci/verify_interop_fixtures.sh
          python3 scripts/check_oci_qualification.py

      - name: Restore bounded producer caches
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ${{ env.WABT_OCI_INTEROP_STATE_DIR }}/tools/downloads
            ${{ env.WABT_OCI_INTEROP_STATE_DIR }}/tools/rustup
            ${{ env.WABT_OCI_INTEROP_STATE_DIR }}/tools/cargo
            ${{ env.WABT_OCI_INTEROP_STATE_DIR }}/tools/cargo-target
            ${{ env.WABT_OCI_INTEROP_STATE_DIR }}/cache/zig-global
          key: oci-interop-arm64-v1-rust-1.97.0-wkg-5a4c2ab721e12511f39bb9cb42cf71fe76f6c89a-${{ hashFiles('scripts/oci/generate_interop_fixtures.sh', 'scripts/oci/fixture_manifest.py') }}

      - name: Run two clean pinned qualifications
        run: |
          set -euo pipefail
          logs="$WABT_OCI_INTEROP_STATE_DIR/ci-logs"
          mkdir -p "$logs"
          for pass in one two; do
            log="$logs/$pass.log"
            if ! timeout --foreground 55m \
              bash scripts/oci/generate_interop_fixtures.sh >"$log" 2>&1; then
              echo "external interoperability pass $pass failed" >&2
              exit 1
            fi
            grep -Fx "mode=qualify" \
              "$WABT_OCI_INTEROP_STATE_DIR/results/status.txt"
            grep -Fx "verified=2026-09-19T00:00:00Z" \
              "$WABT_OCI_INTEROP_STATE_DIR/results/status.txt"
            bash scripts/oci/verify_interop_fixtures.sh
          done
          git diff --exit-code -- src/fixtures/oci
          test ! -e "$WABT_OCI_INTEROP_STATE_DIR/work"
          used_kib="$(du -sk "$WABT_OCI_INTEROP_STATE_DIR" | awk '{print $1}')"
          test "$used_kib" -le "$WABT_OCI_INTEROP_MAX_STATE_KIB"
          rm -rf "$logs"

      - name: Prepare concise redacted failure diagnostics
        if: failure()
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          state = Path(os.environ["WABT_OCI_INTEROP_STATE_DIR"])
          output = Path("zig-out/oci-interop-failure/summary.txt")
          output.parent.mkdir(parents=True, exist_ok=True)
          manifest = json.loads(Path("src/fixtures/oci/manifest.json").read_text())
          lines = [
              "OCI external interoperability failure",
              f"schema={manifest['schema']}@{manifest['schemaVersion']}",
              f"platform={manifest['executionPlatform']}",
              f"oras={manifest['producers']['oras']['version']} "
              f"{manifest['producers']['oras']['binary']['sha256']}",
              f"wkg={manifest['producers']['wkg']['version']} "
              f"{manifest['producers']['wkg']['binary']['sha256']}",
              f"registry={manifest['producers']['registry']['version']} "
              f"{manifest['producers']['registry']['binary']['sha256']}",
          ]
          candidates = sorted((state / "ci-logs").glob("*.log"))
          candidates += sorted((state / "work" / "logs").glob("*"))
          remaining = 48 * 1024
          for path in candidates:
              if not path.is_file() or remaining <= 0:
                  continue
              data = path.read_bytes()[-min(path.stat().st_size, 16 * 1024):]
              text = data.decode("utf-8", "replace")
              text = re.sub(
                  r"(?i)(authorization|password|token)(\s*[:=]\s*)\S+",
                  r"\1\2<redacted>",
                  text,
              )
              text = re.sub(r"(https?://[^\s?]+)\?[^\s]+", r"\1?<redacted-query>", text)
              section = f"\n--- {path.name} (tail) ---\n{text}"
              encoded = section.encode("utf-8")[:remaining]
              lines.append(encoded.decode("utf-8", "ignore"))
              remaining -= len(encoded)
          output.write_text("\n".join(lines)[:64 * 1024] + "\n", encoding="utf-8")
          PY
          test "$(wc -c < zig-out/oci-interop-failure/summary.txt)" -le 65536

      - name: Upload concise failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: oci-interop-failure-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 3
          path: zig-out/oci-interop-failure/summary.txt
